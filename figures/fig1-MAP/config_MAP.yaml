# Configuration for plot_MAP.py
# Overview map of the GreenFjord sampling programme: every sampling location
# by cluster over the GEUS topographic map of south Greenland, with the two
# studied fjords boxed and a locator inset.
#
# Coordinates are always given as lon/lat in decimal degrees (EPSG:4326),
# bounding boxes as [west, south, east, north] and extents as [w, e, s, n].

inputs:
  # Paths are relative to this folder.
  # The master sampling spreadsheet, cached as CSV by data/download_sample_locations.py.
  # Needs the columns Cluster, Type, Lat, Lon, Location and Station ID.
  sample_locations: data/greenfjord_sample_locations.csv
  # Row 0 of the sheet holds per-column instructions for the people filling it
  # in, so the header is on row 1. Number of rows skipped when reading the CSV.
  sample_locations_skiprows: 1
  # Municipal boundaries (geoBoundaries GRL ADM1, 2020) with a `shapeName` field;
  # repo-level data/, see DATA_SOURCES.md (S31). Drawn on the inset only.
  municipalities: ../../data/geoboundaries_grl_adm1/geoBoundaries-GRL-ADM1.geojson
  # Remote input (needs network access): GEUS 1:250 000 topographic map of
  # Greenland (tan land, blue water, contours), as a WMTS service.
  # GEUS moved this service off data.geus.dk (which now 404s, as in the original
  # notebook) to imagedata.geus.dk; see the dataset record
  # metadata.geus.dk/geonetwork/srv/api/records/f3c6c2e4-f161-4c42-83a4-b7acbd127980
  basemap_wmts_url: https://imagedata.geus.dk/arcgis/rest/services/Greenland/G250_Topographic_Map_UTM24N/MapServer/WMTS
  basemap_wmts_layer: Greenland_G250_Topographic_Map_UTM24N # layer name in the WMTS service

analysis:
  # Projected CRS (UTM 24N) in which point distances are measured for the
  # `merge_dist_m` thresholds and the along-track ordering of ocean stations.
  work_epsg: 32624

  # ---------------------------------------------------------------------------
  # Ocean cluster: CTD stations, drawn as the ship's track
  #
  # The ocean stations form two fjord transects plus a scattering of stations
  # that belong to neither. Stations within `merge_dist_m` of each other are
  # merged to a single dot (the sheet lists repeat visits separately), then
  # ordered nearest-neighbour so the connecting line follows the fjord.
  # ---------------------------------------------------------------------------
  ocean:
    cluster: Ocean # value of the sheet's `Cluster` column

    # Shelf stations sit outside both fjords and are split between the two
    # transects by the first letter of their Station ID.
    shelf:
      location_prefix: Shelf # `Location` prefix identifying shelf stations
      # "L..." shelf stations continue the land-fjord line; the rest continue the
      # glacial-fjord line.
      land_fjord_station_prefix: L

    # Drawn in this order (after the loose stations).
    transects:
    - key: glacial # name of the transect (referenced by plot.ocean.legend_transect)
      location_prefixes: [ EKAS ] # `Location` prefixes belonging to the transect
      shelf: other # takes the shelf stations *not* matching `land_fjord_station_prefix`
      # The cryosphere cluster also logged CTD casts in the glacial fjord; they
      # are part of this transect rather than of the cryosphere markers.
      include_cryosphere_ctd: true
      merge_dist_m: 2000 # stations closer than this are merged, metres
    - key: land
      location_prefixes: [ Igaliku ]
      shelf: match # takes the shelf stations matching `land_fjord_station_prefix`
      merge_dist_m: 2000 # metres
    # Everything left over: dots only, no connecting line.
    other:
      merge_dist_m: 1000 # metres

  # ---------------------------------------------------------------------------
  # The remaining clusters, one marker layer each. THIS LIST DEFINES THE ORDER:
  # layers are drawn in this order (later entries sit on top) and the legend
  # lists them in the same order, below the ocean line. The styling of each layer
  # is in plot.markers.layers under the same `key`.
  # ---------------------------------------------------------------------------
  layers:
  - key: human # name of the layer (key in plot.markers.layers)
    cluster: Human # value of the sheet's `Cluster` column
    merge_dist_m: 2000 # sites closer than this are merged to their midpoint, metres
  - key: cryosphere
    cluster: Cryoshpere # the misspelling is in the source sheet
    merge_dist_m: 2000 # metres
    exclude_types: [ CTD ] # CTD casts are drawn with the ocean transects
  - key: atmosphere
    cluster: Atmosphere
    # Kangerlussuaq is ~450 km north and would blow up the map extent.
    exclude_location_prefixes: [ Kanger ]
    # Atmospheric sampling is mobile (kites, filters along the road), so nearby
    # sites are merged far more aggressively than the point-based clusters.
    merge_dist_m: 20000 # metres
  - key: land
    cluster: Land
    include_types: [ Water ] # stream/river water samples only
    # One dot per named site (the mean of its repeat samples) rather than a
    # distance-based merge, so each catchment appears exactly once.
    group_by_location: true
  - key: biodiversity
    cluster: Biodiversity
    merge_dist_m: 5000 # metres

  # ---------------------------------------------------------------------------
  # Manual edits to the sampling locations, applied after the merging above.
  # Both of these were requested by Lisa Bröder (email thread from Julia,
  # 2025-07-11): the Igaliku outwash plain should be shown as a land site, and
  # the cryosphere work at the Igaliku glacier was missing from the sheet.
  # `id` is the row label: the site name for `land` (which is indexed by
  # location), the spreadsheet row number for the distance-merged layers.
  # ---------------------------------------------------------------------------
  edits:
    add:
    - layer: land # layer key (analysis.layers)
      id: Igaliku river
      lon: -45.161838 # degrees east
      lat: 60.925885 # degrees north
    - layer: cryosphere
      id: Igaliku glacier
      lon: -45.112572 # degrees east
      lat: 60.952156 # degrees north
    drop:
    - layer: land
      id: Igaliku Fjord # superseded by "Igaliku river" above

  # Municipalities whose shared borders are drawn on the inset. Only edges shared
  # by two listed municipalities are drawn, so the coastline is not doubled with
  # dashes. The National Park is not listed: its borders lie north of the inset
  # extent.
  municipalities:
    name_field: shapeName # attribute of the geojson holding the municipality name
    names: [ Kujalleq, Sermersooq, Qeqqata, Qeqertalik, Avannaata ]

plot:
  figsize: [ 7, 4.6 ] # width, height in inches

  # ---------------------------------------------------------------------------
  # Map frame
  # ---------------------------------------------------------------------------
  map:
    # UTM 24N: the GEUS topographic WMTS is only served in this projection.
    epsg: 32624
    # cartopy derives the projection bounds from the EPSG definition, which is
    # wider than the tile matrix GEUS publishes; without this override `add_wmts`
    # cannot match a tile matrix set. (x0, x1, y0, y1) in projected metres.
    projection_bounds: [ 0, 804000, 100000, 9329000 ]
    # Extent used while drawing (and for the red box in the inset map).
    extent: [ -47.9, -44.5, 60.6, 61.33 ] # w, e, s, n, degrees
    # Added to `extent` once every artist is placed, to make room for the scale
    # bar at the bottom and the legend/inset at the top. Same [w, e, s, n] order.
    extent_pad: [ 0, 0, -0.05, 0.15 ] # degrees
    spine_width: 0.3 # map frame line width, points

  # Ocean transects: one line through the ordered stations, dots for the loose ones
  ocean:
    color: "#32507d" # line and marker colour
    line_width: 2 # points
    marker: o # matplotlib marker code
    marker_size: 2 # points
    # Only one transect gets a legend entry, otherwise "Ocean" is listed several times.
    legend_transect: land # key of the transect (analysis.ocean.transects) that is listed
    label: Ocean # legend text

  # ---------------------------------------------------------------------------
  # Marker layers, in the order set by analysis.layers.
  #
  # `size_scale` multiplies `base_size`, so scaling the whole key up or down is a
  # one-line change. Marker codes are matplotlib's (s = square, P = thick plus,
  # * = star, ^ = triangle, o = circle).
  # ---------------------------------------------------------------------------
  markers:
    base_size: 7 # marker size before `size_scale`, points
    edge_color: "k" # marker edge colour
    edge_width: 0.3 # marker edge width, points
    layers:
      human:
        label: Human # legend text
        marker: s # matplotlib marker code
        size_scale: 0.7 # multiplier on base_size
        color: "white" # fill colour
      cryosphere:
        label: Cryosphere
        marker: P
        size_scale: 0.8
        color: "#4cd9c4"
      atmosphere:
        label: Atmosphere
        marker: "*"
        size_scale: 1.2
        color: "#fa87af"
      land:
        label: Land
        marker: ^
        size_scale: 0.8
        color: "#FA9F42"
      biodiversity:
        label: Biodiversity
        marker: o
        size_scale: 0.5
        color: "#f9d423"

  # ---------------------------------------------------------------------------
  # The two boxed fjords. Each box is drawn twice: a thicker semi-transparent
  # black line first, then the coloured line on top, so it reads against both the
  # tan land and the blue water.
  # ---------------------------------------------------------------------------
  highlight_boxes:
    line_width: 2 # points
    edge_color: "k" # colour of the thicker underlay line
    edge_alpha: 0.7 # opacity of the underlay line
    # The coloured line is drawn at `inner_width_scale` x `line_width`.
    inner_width_scale: 0.7
    boxes:
    - bbox: [ -45.925963, 61.255, -45.628645, 61.361010 ] # w, s, e, n, degrees
      color: "#4cd9c4" # matches the cryosphere marker
      label: |
        Sermilik-Ikersuaq
        Marine-terminating fjord
      label_lonlat: [ -45.589351, 61.32 ] # label anchor, degrees
    - bbox: [ -45.46, 60.88, -44.98, 61.05 ] # w, s, e, n, degrees
      color: "#FA9F42" # matches the land marker
      label: |
        Igalikup
        Kangerlua
        Land-terminating
        fjord
      label_lonlat: [ -44.94, 60.987654 ] # label anchor, degrees

  # ---------------------------------------------------------------------------
  # Text on the main map (box labels and settlement names). All text on the map
  # is drawn with a white outline so it stays readable over the contoured basemap.
  # ---------------------------------------------------------------------------
  text:
    font_size: 6 # pt
    color: "k" # text colour
    halo_width: 0.8 # outline width, points
    halo_color: "white" # outline colour
    halo_alpha: 0.6 # outline opacity

  place_names:
  # Positions are the label anchor (left-aligned, vertically centred), not the
  # settlement itself, so they can be nudged clear of the markers.
  - { text: Narsaq, lonlat: [ -45.998662, 60.912675 ] } # lonlat in degrees
  - { text: Qaqortoq, lonlat: [ -46.068453, 60.743331 ] }
  - { text: Qassiarsuk, lonlat: [ -45.51705, 61.110994 ] }
  - { text: Igaliku, lonlat: [ -45.387133, 61.010000 ] }

  # ---------------------------------------------------------------------------
  # The diffuse pink blob around Narsaq: the aerosol source region, which has no
  # hard boundary. Built from `n_rings` nested ellipses of increasing size, each
  # at `alpha`, so the fill fades outwards, plus a dashed outline at full size.
  # Sizes are in degrees: `max_radius` is the semi-axis in latitude and the
  # ellipse is twice as wide as it is tall.
  # ---------------------------------------------------------------------------
  atmosphere_area:
    center_lonlat: [ -46.05, 60.912675 ] # degrees
    max_radius: 0.3 # degrees
    aspect: 2 # width / height
    n_rings: 30 # number of nested ellipses
    color: "#fa87af"
    alpha: 0.04 # opacity of each ring
    outline:
      line_width: 0.5 # points
      line_style: "none" # "none" draws no outline; "--" would dash it
      alpha: 0.5 # opacity of the outline

  legend:
    loc: upper right # legend corner placed at `anchor`
    anchor: [ 0.52, 0.99 ] # axes fractions; inside the axes, left of the map's busy right half
    ncol: 1 # number of columns
    font_size: 6 # pt
    frame_alpha: 1 # opacity of the legend background
    edge_color: "0.8" # frame colour (grey level)
    frame_width: 0.3 # frame line width, points

  # `size` is a matplotlib-map-utils preset (xs, sm, md, lg); it sets the default
  # proportions of every part of the bar/arrow.
  scale_bar:
    size: xs
    location: lower left
    max_km: 30 # length of the bar, km
    label: 30 km # text next to the bar (should match max_km)
    font_size: 5 # pt

  north_arrow:
    size: xs
    location: lower left
    anchor: [ 0.0, 0.05 ] # axes fractions, clear of the scale bar
    line_width: 0.3 # points

  # ---------------------------------------------------------------------------
  # Locator inset: southern Greenland, with the main map's extent as a red box.
  # ---------------------------------------------------------------------------
  inset:
    location: upper left
    # The inset is a separate axes drawn after the main one, so it would paint over
    # the legend; keep it far enough left that the two do not overlap.
    pad: [ 0.07, 0.01 ] # inches from the axes corner (x, y)
    size: 1 # inches
    # Optional plain axes flush with the main map's top-left corner, drawn under
    # the inset so it sits on a solid panel instead of the basemap.
    background:
      show: true # draw the panel
      size: [ 1.8, 1.3 ] # inches (width, height); the inset spans ~2.0 x 1.95
      color: "white" # fill colour
      alpha: 0.9 # fill opacity only; the edge stays opaque
      edge_color: "k"
      line_width: 0.3 # points
    projection:
      central_longitude: -55 # degrees east
      central_latitude: 60 # degrees north
    # extent: [ -57, -34, 58, 71 ] # w, e, s, n
    extent: [ -57, -34, 58, 65 ] # w, e, s, n, degrees
    land_color: "#edeadf"
    coastline:
      resolution: 10m # Natural Earth 10 m (land and coast; 50m was too coarse for fjords)
      color: "k"
      line_width: 0.3 # points
      alpha: 0.7
    extent_box: # red box marking the main map's extent
      edge_color: "r"
      line_width: 1 # points
    places:
      Nuuk: [ -51.683857, 64.174465 ] # lon, lat in degrees
      # Sisimiut: [ -53.679586, 66.939339 ]
    place_style:
      marker: "." # matplotlib marker code
      marker_size: 5 # points
      marker_color: "k"
      marker_line_width: 0.5 # points
      font_size: 5 # pt
      alpha: 0.4 # label opacity
      label_offset_lon: 1.5 # label shift east of the marker, degrees
    # Municipal boundaries (dashed) and a "Kujalleq" label, drawn on the inset only.
    # Which municipalities: analysis.municipalities. Source: geoBoundaries GRL ADM1
    # (2020), see DATA_SOURCES.md (S31).
    municipalities:
      line_width: 0.5 # points
      line_style: "--"
      color: "0.35" # grey level
      alpha: 0.9
      label:
        text: Kujalleq
        lonlat: [ -45, 61.8 ] # label centre, inside the Kujalleq polygon, degrees
        font_size: 5 # pt
        bbox_pad: 0.5 # points of land-coloured padding around the text
        alpha: 0.8

  # matplotlib rcParams overriding the shared paper style (greenfjord.viz.set_paper_style)
  style:
    # The shared style sets 8 pt; the scale bar and north arrow take their size
    # from the default font size, so keep matplotlib's default of 10 pt.
    font.size: 10 # pt

output:
  formats: [ png, pdf ] # figure file formats
  dpi: 300 # resolution of raster formats, dots per inch
