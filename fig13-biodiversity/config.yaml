# Configuration for plot_biodiversity_transects.py
# Tweak any value here and re-run:  uv run python plot_biodiversity_transects.py

data:
  fish_catch: data/fish_catch/FIX012_20241112-130447.csv # panel (a): Greenland Statistics landings
  edna_fish: data/edna/share_mifish_greenfjord_tablefull.csv # panel (b): MiFish 12S
  edna_plankton: data/edna/share_eukatara_table.csv # panel (b): Eukaryote 18S (EukAtara)
  bedmachine: data/BedMachine/BedMachineGreenland_bed-v6.tif
  fjord_pickle: data/fjords/fjord_{fjord_num}/fjord_aggregator.pkl_joblib
  # Bathymetry transects are slow to extract from BedMachine, so they are cached
  # here. Delete the cache after changing `transects.bathymetry.agg_method`.
  bathymetry_cache: data/bathymetry_{agg_method}_fjord_{fjord_num}.nc

output:
  path: fig13-biodiversity.png
  dpi: 300
  figsize: [ 10, 6 ] # width, height in inches

# ---------------------------------------------------------------------------
# Figure layout. All values are figure fractions (0 = left/bottom, 1 = right/top).
# `landings` and `transects` are the two subplot rows; raise `transects.top` or
# lower `landings.bottom` to close the vertical gap between the rows.
# ---------------------------------------------------------------------------
layout:
  shared:
    # applied to both subplot rows
    left: 0.08
    right: 0.98
    wspace: 0.13 # horizontal gap between the left and right subplot
  landings:
    # row 1: panels (a) and (b)
    top: 0.900
    bottom: 0.73
  landings_legend:
    # the species-line legend, drawn inside one of the landings panels
    panel: 0 # position in `landings.districts`: 0 = Qaqortoq, 1 = Narsaq
    loc: upper left
    anchor: [ 0.02, 1.05 ] # position within that panel's axes
    ncol: 2
  transects:
    # row 2: panels (c) and (d)
    top: 0.62
    bottom: 0.290
  legends:
    # the eDNA swatch legends below row 2 (one line each)
    left: 0.08 # x of the bold "Fish" / "Plankton" titles
    entries_left: 0.16 # x where the swatches start, right of the title
    top: 0.185 # vertical centre of the "Fish" line
    row_gap: 0.045 # "Fish" line -> "Plankton" line

style:
  spine_color: "#555555"
  spine_width: 0.6
  tick_width: 0.6
  tick_length: 2.5
  font_size: 9 # base size: tick labels, axis labels
  panel_label_size: 11 # the "(a) Narsaq: ..." labels above each subplot
  legend_font_size: 9 # every legend entry (species lines, swatches, the key)
  legend_title_size: 9 # the bold "Fish" / "Plankton" titles
  legend_line_scale: 2 # legend line swatches are this much thicker than the plotted lines

# ---------------------------------------------------------------------------
# Panel (a): commercial landings, Narsaq and Qaqortoq districts
# Source file is monthly x vessel-type x species; we sum to annual totals.
# `species` are drawn as individual lines; everything else in the file is
# summed into the "other" line.
# ---------------------------------------------------------------------------
landings:
  # Panel label: bold "(a)" is added automatically, this is the plain part.
  panel_description: "{district}"
  districts:
    # name in the source file -> label used for {district} in panel_description
    # left to right; panels are lettered in this order
    Qaqortoq: Qaqortoq (land fjord)
    Narsaq: Narsaq (glacial fjord)
  value_column: Total landings of fish and shellfish
  na_value: "-" # the CSV marks missing months with a dash
  species:
    # name in file -> line colour
    # Matches the fish colours in `edna.colors`, so a species looks the same in
    # every panel it appears in.
    Atlantic cod: "#245982"
    Greenland halibut: "#1785cf"
    Lumpfish: "#f59384"
  other_label: Other species
  other_color: "#aaaaaa"
  other_width: 0.8
  line_width: 3
  ylabel: "Commercial fish\nlandings (tonnes)"
  ylim: [ 0, 1320 ]
  yticks: [ 0, 400, 800, 1200 ]
  # All 13 years do not fit at the base font size; list the ones you want.
  xticks: [ 2013, 2015, 2017, 2019, 2021, 2023 ]

# ---------------------------------------------------------------------------
# Panel (b): eDNA community composition along the two fjord transects
# ---------------------------------------------------------------------------
transects:
  panel_description: "{label}"
  xlabel: Distance from glacier (km)
  ylabel: Depth (m)

  # Station distance-from-glacier is measured along the same fjord centreline
  # that the bathymetry is aggregated onto, so the dots always sit on the
  # section. Set to false to use the hand-digitised values in
  # `examples/edna_plot.R` instead (those sit ~4-5 km closer to the glacier,
  # because the centreline here starts at the head of the catchment rather
  # than at the present-day terminus).
  distance_from_centerline: true
  manual_distance_km:
    # fallback / examples/edna_plot.R values, keyed by station letter
    B: 27
    D: 57
    K: 92
    Z: 7
    W: 30
    V: 58

  # Stations are matched to a fjord by the letter in their ID (GF23_<letter>_...).
  # Station E sits in a side fjord that is not part of either transect (it is
  # also dropped in examples/edna_plot.R) and is excluded.
  fjords:
  # left to right; panels are lettered in this order
  - fjord_num: 56
    label: Land fjord
    stations: [ Z, W, V ]
    xlim: [ 2, 72 ] # trimmed: the last few km are shallow skerries at the fjord mouth
    ylim: [ 520, -20 ] # depth axis, inverted
    yticks: [ 0, 100, 200, 300, 400, 500 ]
  - fjord_num: 54
    label: Glacial fjord
    stations: [ B, D, K ]
    xlim: [ 2, 110 ] # trimmed: the last few km are shallow skerries at the fjord mouth
    ylim: [ 720, -20 ]
    yticks: [ 0, 100, 200, 300, 400, 500, 600, 700 ]

  bathymetry:
    # How BedMachine is collapsed across each cross-fjord polygon. "min" is the
    # thalweg (deepest point), which is what a fjord long-section should show and
    # which is deep enough to contain the deep eDNA casts; "median" is shallower
    # and much rougher because it averages in the fjord walls.
    agg_method: min
    # The section is labelled in place, in the bottom-left of each panel,
    # instead of taking up a legend row. x/y are axes fractions.
    label:
      text: BedMachine v6 bathymetry
      color: "#9e9a92"
      size: 8
      x: 0.015
      y: 0.03
    fill_color: "#e8e6e0"
    line_color: "0.7"
    line_width: 0.8
    smooth_km: 2.0 # rolling-mean window applied to the BedMachine section

  # The little stacked-bar "flags". Sizes are fractions of each panel's own axis
  # ranges, so the bars look identical in both panels even though the two fjords
  # have different depth ranges. Raise `row_height_frac` for chunkier bars, but
  # check the deep flags still clear the seabed.
  flags:
    width_frac: 0.22 # flag width, as a fraction of the panel's x-range
    row_height_frac: 0.08 # thickness of each stacked bar, fraction of the y-range
    row_gap_frac: 0.01 # gap between the fish and plankton bars, fraction of the y-range
    edge_color: white
    edge_width: 0.6
    marker_size: 18
    labels:
      # Segments get their two-letter abbreviation (`edna.abbrev`) printed inside
      # them, but only if they are wide enough for the letters to fit.
      min_width_pct: 24 # label a segment only if it is >= this % of the bar width
      size: 7.5
      # Text colour is picked from the segment's own colour: light letters on dark
      # fills, dark letters on light fills.
      color_on_dark: "#ffffff"
      color_on_light: "#1a1a1a"
      # WCAG relative luminance of the fill above which the fill counts as "light".
      # 0.21 is the crossover for this palette: every fill above it has more
      # contrast against `color_on_light`, every fill below it against
      # `color_on_dark`. Raise it to push mid-tones back to white text.
      luminance_threshold: 0.31
    leader_color: "#111111"
    leader_width: 0.7
    # Where each flag sits, as the (x, y) *centre* of the two-bar block in data
    # coordinates (km from glacier, depth in m). Keyed by station ID. The fish
    # row is drawn first, the plankton row below it.
    # Either coordinate may be `auto`, which takes the station's own value so the
    # flag centres on its marker: [ auto, 80 ] aligns the bars with the marker in
    # x, [ 40, auto ] in y, and a bare `auto` centres the flag on the marker.
    placement:
      # land fjord
      GF23_Z_2m: [ auto, 80 ]
      GF23_Z_260m: [ 16, 190 ]
      GF23_W_2m: [ auto, 80 ]
      GF23_W_380m: [ auto, 290 ]
      GF23_V_2m: [ auto, 80 ]
      GF23_V_240m: [ auto, 190 ]
      # glacial fjord
      GF23_B_2m_edna: [ 19, 100 ]
      GF23_B_355m_edna: [ 19, 285 ]
      GF23_D_2m_edna: [ auto, 155 ]
      GF23_D_600m_edna: [ auto, 475 ]
      GF23_K_2m: [ auto, 155 ]
      GF23_K_630m: [ auto, 475 ]

# ---------------------------------------------------------------------------
# eDNA grouping and colours
#
# Fish: the MiFish reads are assigned to the seven focal taxa below; everything
# else (including the large genus-level `Gadus` block, which cannot be split
# between G. morhua and G. ogac at 12S resolution) falls into "Other".
# The two sequences in `gadus_morhua_sequences` are re-assigned to G. morhua,
# following the correction in examples/edna_plot.R.
#
# Plankton: 18S reads are grouped by Class; the classes listed below are kept
# and the rest are pooled into "Other".
# ---------------------------------------------------------------------------
edna:
  gadus_morhua_sequences:
  - CACCGCGGTTATACGAGAGGCCCAAATTGATGAAGAACGGCGTAAAGCGTGGTTAAGAAAAAAGAGAAAATATGGCCGAACAGCTTCAAAGCAGTTATACGCATCCGAAGTCACGAAGAACAATCACGAAAGTTGCCCTAAAACCTCCGATTCCACGAGAGCCATAAAA
  - CACCGCGGTTATACGAGAGGCCCTAATTGATGAAGAACGGCGTAAAGCGTGGTTAAGAAAAAAGAGAAAATATGGCCGAACAGCTTCAAAGCAGTTATACGCATCCGAAGTCACGAAGAACAATCACGAAAGTTGCCCTAAAACCTCCGATTCCACGAAAGCCATAAAA

  fish_groups:
    # scientific_name in file -> group shown in the figure
    Gadus morhua: Atlantic cod
    Reinhardtius hippoglossoides: Greenland halibut
    Mallotus villosus: Capelin
    Sebastes mentella: Redfish
    Sebastes: Redfish
    Cyclopterus lumpus: Lumpfish
    Anarhichas: Wolfish

  plankton_classes: [ Dinoflagellata, Ciliophora, Chlorophyta, Ochrophyta, Metazoa ]

  other_label: Other

  # Two-letter codes printed inside wide bar segments (see
  # `transects.flags.labels`) and appended to the legend entries. Anything not
  # listed here falls back to the first two letters of the group name.
  abbrev:
    # fish
    Atlantic cod: At
    Greenland halibut: Gr
    Capelin: Ca
    Redfish: Re
    Lumpfish: Lu
    Wolfish: Wo
    # plankton
    Dinoflagellata: Di
    Ciliophora: Ci
    Chlorophyta: Ch
    Metazoa: Me
    Ochrophyta: Oc
    Other: Ot
  # Bold the code where it sits in each legend entry ("Atlantic cod" is drawn
  # with "At" in bold) so the letters inside the bars can be decoded without
  # spending extra width on them. Set to false for plain labels.
  legend_bold_abbrev: true

  # Draw order (left to right within a bar) and colours.
  fish_order: [ Atlantic cod, Greenland halibut, Capelin, Lumpfish, Redfish, Wolfish ]
  plankton_order: [ Dinoflagellata, Ciliophora, Chlorophyta, Metazoa, Ochrophyta, Other ]
  # Fish are blues and purples, plankton greens and yellows, so the two assays
  # stay visually separate. Within each family the groups alternate dark ->
  # light so neighbouring segments in a stacked bar differ in lightness as well
  # as hue. "Other" is the only neutral.
  colors:
    # fish
    Atlantic cod: "#245982"
    Greenland halibut: "#1785cf"
    Capelin: "#62d8f0"
    Lumpfish: "#f59384"
    Redfish: "#f75454"
    Wolfish: "#b52121"
    # plankton
    Dinoflagellata: "#145A32"
    Ciliophora: "#26945B"
    Chlorophyta: "#78B82A"
    Metazoa: "#C79A00"
    Ochrophyta: "#F1D447"
    Other: "#c2c2c2"
